# Build ThaiCustoms desktop installers (Windows .exe + Mac .dmg).
#
# Two ways to build:
#   1. Push a tag:  git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#      -> builds both installers and attaches them to a GitHub Release.
#   2. Actions tab -> desktop-installers -> Run workflow -> type a version
#      -> builds both installers as downloadable Artifacts (no release).

name: desktop-installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".Replace("desktop-v", "") } else { $ver = "${{ inputs.version }}" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: iscc /DAppVersion=${{ steps.v.outputs.ver }} desktop\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiCustoms-Setup-win64
          path: desktop/windows/dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ver="${{ github.ref_name }}"; ver="${ver#desktop-v}"; else ver="${{ inputs.version }}"; fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        shell: bash
        run: bash desktop/macos/build-dmg.sh "${{ steps.v.outputs.ver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiCustoms-mac-dmg
          path: desktop/macos/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
