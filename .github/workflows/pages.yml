# Deploy the ซอฟแวร์ดีดี showcase site (site/) to GitHub Pages.
#
# One-time setup (click once in the browser):
#   Repo Settings -> Pages -> Source: "GitHub Actions".
# After that, every push to the gateway branch that touches site/
# redeploys automatically. Manual run: Actions -> deploy-site.

name: deploy-site

on:
  push:
    branches: [gateway]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
