<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1640px; height:628px; background:#0c4a42; color:#fff;
    font-family:'Sarabun','Leelawadee UI',Tahoma,Arial,sans-serif;
    display:flex; align-items:center; overflow:hidden; }
  .mark { width:560px; display:flex; justify-content:center; }
  .text { width:1080px; padding-right:120px; }
  h1 { font-family:Arial,Helvetica,sans-serif; font-size:118px; font-weight:900;
    letter-spacing:2px; line-height:1; }
  h1 span { color:#fb923c; }
  .tag { font-size:46px; margin-top:18px; color:#d7efe9; }
  .badge { display:inline-block; margin-top:26px; background:#c2410c; color:#fff;
    font-size:38px; font-weight:bold; padding:12px 38px; border-radius:999px; }
</style></head><body>
  <div class="mark">
    <svg width="300" height="300" viewBox="0 0 400 400">
      <rect x="95" y="140" width="150" height="100" rx="10" fill="#ffffff"/>
      <rect x="122" y="152" width="10" height="76" fill="#0c4a42"/>
      <rect x="152" y="152" width="10" height="76" fill="#0c4a42"/>
      <rect x="182" y="152" width="10" height="76" fill="#0c4a42"/>
      <rect x="212" y="152" width="10" height="76" fill="#0c4a42"/>
      <circle cx="265" cy="235" r="55" fill="#c2410c"/>
      <polyline points="238,235 257,254 294,212" fill="none" stroke="#ffffff"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="text">
    <h1>Thai<span>Customs</span></h1>
    <div class="tag">เช็คพิกัดศุลกากร อากรขาเข้า สิทธิ FTA ด้วย AI</div>
    <div class="badge">ทดลองฟรี 3 คำถาม ไม่ต้องผูกบัตร</div>
  </div>
</body></html>
